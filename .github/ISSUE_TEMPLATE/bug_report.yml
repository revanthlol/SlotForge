name: Bug report
description: Report reproducible SlotForge behavior that is not working as intended.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private timetable data, or security vulnerabilities. Use SECURITY.md for vulnerabilities."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the route, action, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, and relevant commit or deployment.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private institution data and secrets before attaching anything.
